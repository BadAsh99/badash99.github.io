<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#0D1B3E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#3B82F6"/>

  <!-- Week label -->
  <rect x="60" y="60" width="120" height="36" rx="18" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="84" font-family="monospace" font-size="14" font-weight="bold" fill="#93C5FD" text-anchor="middle">WEEK 01</text>

  <!-- Series name -->
  <text x="60" y="200" font-family="monospace" font-size="18" fill="#3B82F6" letter-spacing="6">#BADASHWEDNESDAYS</text>

  <!-- Title -->
  <text x="60" y="290" font-family="monospace" font-size="48" font-weight="bold" fill="#F9FAFB">The Pivot.</text>
  <text x="60" y="360" font-family="monospace" font-size="24" fill="#9CA3AF">Manual SASE → Agentic AI Security Workflows</text>

  <!-- Divider -->
  <line x1="60" y1="400" x2="500" y2="400" stroke="#1F2937" stroke-width="1"/>

  <!-- Author + date -->
  <text x="60" y="440" font-family="monospace" font-size="15" fill="#6B7280">Ash Clements · Palo Alto Networks · #BadAshWednesdays</text>

  <!-- BA99 badge large -->
  <polygon points="1080,80 1150,120 1150,200 1080,240 1010,200 1010,120" fill="#0D1B3E" stroke="#3B82F6" stroke-width="2"/>
  <text x="1080" y="155" font-family="monospace" font-size="22" font-weight="bold" fill="#3B82F6" text-anchor="middle">BA</text>
  <text x="1080" y="185" font-family="monospace" font-size="22" font-weight="bold" fill="#3B82F6" text-anchor="middle">99</text>

  <!-- Bottom tags -->
  <rect x="60" y="540" width="70" height="26" rx="13" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="95" y="558" font-family="monospace" font-size="11" fill="#93C5FD" text-anchor="middle">SASE</text>
  <rect x="145" y="540" width="100" height="26" rx="13" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="195" y="558" font-family="monospace" font-size="11" fill="#93C5FD" text-anchor="middle">AI Security</text>
  <rect x="260" y="540" width="120" height="26" rx="13" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="320" y="558" font-family="monospace" font-size="11" fill="#93C5FD" text-anchor="middle">Palo Alto Networks</text>
</svg>
