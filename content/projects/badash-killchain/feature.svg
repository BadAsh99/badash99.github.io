<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#1A0A0A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EF4444" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left threat-red accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#EF4444"/>

  <!-- Decorative corner bracket TL -->
  <path d="M 60 40 L 60 60 L 40 60" fill="none" stroke="#EF4444" stroke-width="2"/>
  <!-- Decorative corner bracket BR -->
  <path d="M 1140 590 L 1140 570 L 1160 570" fill="none" stroke="#EF4444" stroke-width="2"/>

  <!-- BA99 badge -->
  <polygon points="1100,50 1150,75 1150,125 1100,150 1050,125 1050,75" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="1100" y="97" font-family="monospace" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">BA</text>
  <text x="1100" y="117" font-family="monospace" font-size="16" font-weight="bold" fill="#EF4444" text-anchor="middle">99</text>

  <!-- Category label -->
  <text x="60" y="220" font-family="monospace" font-size="14" fill="#EF4444" letter-spacing="4">AI RED TEAM · THREAT RESEARCH</text>

  <!-- Title -->
  <text x="60" y="300" font-family="monospace" font-size="56" font-weight="bold" fill="#F9FAFB">badash-</text>
  <text x="60" y="370" font-family="monospace" font-size="56" font-weight="bold" fill="#EF4444">killchain</text>

  <!-- Descriptor -->
  <text x="60" y="430" font-family="monospace" font-size="18" fill="#9CA3AF">LLM attack chain mapping · Prompt injection · AIRS-aligned red teaming</text>

  <!-- Bottom tags -->
  <rect x="60" y="530" width="130" height="28" rx="14" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="125" y="549" font-family="monospace" font-size="12" fill="#FCA5A5" text-anchor="middle">Prompt Injection</text>

  <rect x="205" y="530" width="150" height="28" rx="14" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="280" y="549" font-family="monospace" font-size="12" fill="#FCA5A5" text-anchor="middle">Cross-App Chains</text>

  <rect x="370" y="530" width="110" height="28" rx="14" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="425" y="549" font-family="monospace" font-size="12" fill="#FCA5A5" text-anchor="middle">LLM Red Team</text>

  <rect x="495" y="530" width="80" height="28" rx="14" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="535" y="549" font-family="monospace" font-size="12" fill="#93C5FD" text-anchor="middle">AIRS</text>
</svg>
