<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#1A0E0A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F97316" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left orange accent -->
  <rect x="0" y="0" width="8" height="630" fill="#F97316"/>

  <!-- Corner brackets -->
  <path d="M 60 40 L 60 60 L 40 60" fill="none" stroke="#F97316" stroke-width="2"/>
  <path d="M 1140 590 L 1140 570 L 1160 570" fill="none" stroke="#F97316" stroke-width="2"/>

  <!-- BA99 badge -->
  <polygon points="870,50 920,75 920,125 870,150 820,125 820,75" fill="none" stroke="#F97316" stroke-width="2"/>
  <text x="870" y="97" font-family="monospace" font-size="16" font-weight="bold" fill="#F97316" text-anchor="middle">BA</text>
  <text x="870" y="117" font-family="monospace" font-size="16" font-weight="bold" fill="#F97316" text-anchor="middle">99</text>

  <!-- NL question example -->
  <rect x="860" y="190" width="290" height="36" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="875" y="213" font-family="monospace" font-size="12" fill="#9CA3AF">"Any any-to-any policies?"</text>
  <rect x="860" y="238" width="290" height="36" rx="6" fill="#111827" stroke="#F97316" stroke-width="1"/>
  <text x="875" y="261" font-family="monospace" font-size="12" fill="#FED7AA">3 policies found — CRITICAL</text>

  <!-- Category label -->
  <text x="60" y="220" font-family="monospace" font-size="14" fill="#F97316" letter-spacing="4">PAN-OS · GENAI POSTURE VALIDATION</text>

  <!-- Title -->
  <text x="60" y="300" font-family="monospace" font-size="56" font-weight="bold" fill="#F9FAFB">Firewise</text>
  <text x="60" y="370" font-family="monospace" font-size="56" font-weight="bold" fill="#F97316">AI</text>

  <!-- Descriptor -->
  <text x="60" y="430" font-family="monospace" font-size="18" fill="#9CA3AF">Upload PAN-OS config · Ask in plain English · Get audit-ready analysis</text>

  <!-- Bottom tags -->
  <rect x="60" y="530" width="70" height="28" rx="14" fill="#1A0E00" stroke="#F97316" stroke-width="1"/>
  <text x="95" y="549" font-family="monospace" font-size="12" fill="#FED7AA" text-anchor="middle">PAN-OS</text>

  <rect x="145" y="530" width="90" height="28" rx="14" fill="#1A0E00" stroke="#F97316" stroke-width="1"/>
  <text x="190" y="549" font-family="monospace" font-size="12" fill="#FED7AA" text-anchor="middle">Streamlit</text>

  <rect x="250" y="530" width="70" height="28" rx="14" fill="#1A0E00" stroke="#F97316" stroke-width="1"/>
  <text x="285" y="549" font-family="monospace" font-size="12" fill="#FED7AA" text-anchor="middle">Gemini</text>

  <rect x="335" y="530" width="80" height="28" rx="14" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="375" y="549" font-family="monospace" font-size="12" fill="#93C5FD" text-anchor="middle">GPT-4</text>
</svg>
